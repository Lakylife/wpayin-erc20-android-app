org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Default testnet node (public Quinvium server). A node entered in Settings overrides it.
QUINTIUM_TESTNET_RPC_URL=https://rpc1.quinvium.com
# Default mainnet node (public Quinvium server). A node entered in Settings overrides it.
QUINTIUM_RPC_URL=https://rpc.quinvium.com
# Default explorers (public Quinvium servers). An explorer entered in Settings overrides them.
QUINTIUM_EXPLORER_URL=https://explorer.quinvium.com
QUINTIUM_TESTNET_EXPLORER_URL=https://testnet.quinvium.com
